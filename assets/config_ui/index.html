<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powertrain</title>
<link rel="icon" href="data:,">
<style>
:root {
    --bg: #14161a;
    --panel: #1c1f25;
    --line: #2b3038;
    --text: #dfe3ea;
    --muted: #8b93a1;
    --accent: #6fb2ff;
    --learn: #7ddc9a;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
header {
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
}
h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .04em; }
#status { color: var(--muted); }
main { display: grid; grid-template-columns: minmax(320px, 1fr) 560px; gap: 0; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
#params { padding: 12px 18px; }
#side { border-left: 1px solid var(--line); padding: 12px 18px; }
@media (max-width: 900px) { #side { border-left: none; border-top: 1px solid var(--line); } }
.group { margin-bottom: 18px; }
.group > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 8px; font-weight: 600;
}
.row {
    display: grid;
    grid-template-columns: 1fr 18px 130px 82px;
    gap: 10px;
    align-items: center;
    padding: 3px 0;
}
.row label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .unit { color: var(--muted); font-size: 11px; }
.row.adaptive label::after {
    content: " learned";
    color: var(--learn);
    font-size: 10px;
}
#tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
#tabs button {
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 4px 9px; font: inherit; font-size: 11px; cursor: pointer;
}
#tabs button.on { color: var(--text); border-color: var(--accent); }
#view { width: 100%; height: auto; display: block; background: var(--panel);
        border: 1px solid var(--line); border-radius: 3px; }
#viewNote { color: var(--muted); font-size: 11px; margin-top: 6px; min-height: 1.5em; }
.row input.toggle {
    grid-column: 3 / span 2;
    justify-self: start;
    width: 16px;
    height: 16px;
}

#cellEditor {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 6px;
    font-size: 11px;
    color: #8b93a1;
}

#cellEditor select,
#cellEditor input {
    font: inherit;
    background: #12151b;
    color: #dfe3ea;
    border: 1px solid #2a2f3a;
    border-radius: 3px;
    padding: 2px 4px;
}

#cellEditor input {
    width: 90px;
}

#viewTools { display: flex; gap: 6px; margin-top: 6px; }
#viewTools button {
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 3px 8px; font: inherit; font-size: 11px; cursor: pointer;
}
.row input[type=checkbox] { accent-color: var(--learn); justify-self: end; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=number] {
    width: 100%;
    background: #0f1114;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 3px 6px;
    font: inherit;
    border-radius: 3px;
}
button {
    background: #232830; color: var(--text); border: 1px solid var(--line);
    padding: 5px 12px; border-radius: 3px; font: inherit; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.active { border-color: var(--accent); color: var(--accent); }
table { width: 100%; border-collapse: collapse; }
td { padding: 2px 0; }
td.k { color: var(--muted); }
td.v { text-align: right; font-variant-numeric: tabular-nums; }
canvas { width: 100%; height: 120px; display: block; margin-top: 6px; background: #0f1114; border: 1px solid var(--line); border-radius: 3px; }
#modes { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
pre {
    background: #0f1114; border: 1px solid var(--line); border-radius: 3px;
    padding: 8px; overflow: auto; max-height: 160px; color: var(--muted);
    white-space: pre-wrap; word-break: break-all;
}
</style>
</head>
<body>
<header>
    <h1>POWERTRAIN</h1>
    <span id="status">connecting</span>
    <button id="reset">reset to defaults</button>
</header>

<main>
    <section id="params"></section>
    <aside id="side">
        <div class="group">
            <h2>Calibration</h2>
            <div id="tabs"></div>
            <canvas id="view" width="720" height="420"></canvas>
            <div id="viewTools"></div>
            <div id="cellEditor"></div>
            <div id="viewNote"></div>
        </div>
        <div class="group">
            <h2>Drive mode</h2>
            <div id="modes"></div>
        </div>
        <div class="group">
            <h2>Telemetry</h2>
            <table id="telemetry"></table>
        </div>
        <div class="group">
            <h2>Adaption</h2>
            <table id="learning"></table>
            <canvas id="plot" width="720" height="240"></canvas>
        </div>
        <div class="group">
            <h2>Learned values</h2>
            <pre id="export">—</pre>
        </div>
        <div class="group">
            <h2>Session overrides</h2>
            <pre id="overrides">—</pre>
        </div>
    </aside>
</main>

<script>
const state = { schema: null, values: {}, maps: {}, adaptive: {}, telemetry: {}, dirty: new Set() };
const history = [];
const HISTORY = 240;

async function api(path, body) {
    const options = body === undefined
        ? {}
        : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
    const response = await fetch(path, options);
    if (!response.ok) throw new Error(path + " -> " + response.status);
    const type = response.headers.get("content-type") || "";
    return type.includes("json") ? response.json() : response.text();
}

function groupOf(path) {
    const parts = path.split(".");
    if (parts.length > 2) return parts[0] + "." + parts[1];
    if (parts.length === 2) return parts[0];
    return "general";
}

function labelOf(path, group) {
    return path.startsWith(group + ".") ? path.slice(group.length + 1) : path;
}

function buildParameters() {
    const container = document.getElementById("params");
    container.textContent = "";

    const groups = new Map();
    for (const p of state.schema.registry.parameters) {
        if (p.type === "map") continue;
        const key = groupOf(p.path);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(p);
    }

    for (const [name, items] of groups) {
        const section = document.createElement("div");
        section.className = "group";

        const heading = document.createElement("h2");
        heading.textContent = name;
        section.appendChild(heading);

        for (const p of items) {
            const row = document.createElement("div");
            row.className = "row" + (p.adaptive ? " adaptive" : "");

            const label = document.createElement("label");
            label.textContent = labelOf(p.path, name);
            label.title = p.path;
            row.appendChild(label);

            const learn = document.createElement("input");
            learn.type = "checkbox";
            learn.dataset.path = p.path;
            learn.dataset.role = "adaptive";
            learn.checked = !!p.adaptive;
            learn.title = "let the adaption write this parameter";
            learn.addEventListener("change", () => {
                p.adaptive = learn.checked;
                row.className = "row" + (learn.checked ? " adaptive" : "");
                api("/api/adaptive", { path: p.path, value: learn.checked ? 1 : 0 })
                    .catch(() => {});
            });
            row.appendChild(learn);

            const push = (value) => {
                state.dirty.add(p.path);
                api("/api/set", { path: p.path, value: Number(value) }).catch(() => {});
                setTimeout(() => state.dirty.delete(p.path), 600);
            };

            if (p.type === "boolean") {
                const toggle = document.createElement("input");
                toggle.type = "checkbox";
                toggle.dataset.path = p.path;
                toggle.dataset.role = "value";
                toggle.className = "toggle";
                toggle.title = p.path;
                toggle.addEventListener("change", () => push(toggle.checked ? 1 : 0));

                row.appendChild(toggle);
                section.appendChild(row);
                continue;
            }

            const slider = document.createElement("input");
            slider.type = "range";
            slider.min = p.min;
            slider.max = p.max;
            slider.step = (p.max - p.min) / 500 || 0.001;
            slider.dataset.path = p.path;

            const number = document.createElement("input");
            number.type = "number";
            number.step = "any";
            number.dataset.path = p.path;

            slider.addEventListener("input", () => { number.value = slider.value; push(slider.value); });
            number.addEventListener("change", () => { slider.value = number.value; push(number.value); });

            row.appendChild(slider);
            row.appendChild(number);
            section.appendChild(row);
        }

        container.appendChild(section);
    }
}

function buildModes() {
    const container = document.getElementById("modes");
    container.textContent = "";

    if (!state.schema.modes.length) {
        container.textContent = "none defined";
        return;
    }

    state.schema.modes.forEach((name, index) => {
        const button = document.createElement("button");
        button.textContent = name;
        button.dataset.index = index;
        button.addEventListener("click", () => api("/api/mode", { index }).catch(() => {}));
        container.appendChild(button);
    });
}

function applyValues() {
    for (const [path, flag] of Object.entries(state.adaptive)) {
        for (const box of document.querySelectorAll(
            'input[data-role="adaptive"][data-path="' + CSS.escape(path) + '"]'))
        {
            if (box.checked === flag) continue;
            box.checked = flag;
            box.closest(".row").className = "row" + (flag ? " adaptive" : "");
        }
    }

    for (const [path, value] of Object.entries(state.values)) {
        if (state.dirty.has(path)) continue;
        for (const input of document.querySelectorAll('[data-path="' + CSS.escape(path) + '"]')) {
            if (input.dataset.role === "adaptive") continue;

            if (input.type === "checkbox") {
                input.checked = value >= 0.5;
                continue;
            }

            const rounded = Math.abs(value) >= 1000 ? value.toFixed(1) : value.toPrecision(5);
            if (input.type === "number") input.value = Number(rounded);
            else input.value = value;
        }
    }

    const selected = state.telemetry.selectedMode;
    for (const button of document.querySelectorAll("#modes button")) {
        button.classList.toggle("active", Number(button.dataset.index) === selected);
    }
}

function fill(id, rows) {
    const table = document.getElementById(id);
    table.textContent = "";
    for (const [key, value] of rows) {
        const tr = document.createElement("tr");
        const k = document.createElement("td");
        k.className = "k";
        k.textContent = key;
        const v = document.createElement("td");
        v.className = "v";
        v.textContent = value;
        tr.appendChild(k);
        tr.appendChild(v);
        table.appendChild(tr);
    }
}

const n = (x, digits = 1) => Number(x).toFixed(digits);

function renderTelemetry() {
    const t = state.telemetry;
    fill("telemetry", [
        ["rpm", n(t.engineRpm, 0)],
        ["throttle", n(t.throttlePlate, 3)],
        ["torque", n(t.indicatedTorque) + " / " + n(t.torqueRequest) + " Nm"],
        ["range", t.range || "N"],
        ["gear", (t.range === "P" || t.range === "N") ? "-" : (t.range === "R" ? "R" : (t.gear < 0 ? "N" : String(t.gear + 1)))],
        ["clutch", n(t.clutchPressure, 3)],
        ["speed", n(t.vehicleSpeed * 3.6) + " km/h"],
        ["grade", n(t.roadGrade * 100, 2) + " %"],
        ["coolant", n(t.coolantTemperature - 273.15) + " °C"],
        ["oil", n(t.oilTemperature - 273.15) + " °C"],
        ["spark cut", n(t.ignitionCut, 2)],
        ["fuel cut", n(t.fuelCut, 2)],
        ["engine", t.engineState],
        ["shift", t.shiftState]
    ]);

    fill("learning", [
        ["active", t.adaptionEnabled ? "yes" : "no"],
        ["idle integrator", n(t.idleIntegrator, 4)],
        ["torque correction", n(t.torqueCorrection, 4)],
        ["fuel trim", n(t.fuelTrim, 4)],
        ["shifts learned", String(t.shiftIterations)],
        ["shift error", n(t.shiftErrorNorm, 4)]
    ]);
}

function drawSeries(ctx, w, top, height, values, peak, color) {
    if (peak <= 0) return;

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();

    const span = Math.max(values.length - 1, 1);
    values.forEach((value, i) => {
        const x = (i / span) * w;
        const y = top + height / 2 - (value / peak) * (height / 2 - 3);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });

    ctx.stroke();
}

function plot() {
    const canvas = document.getElementById("plot");
    const ctx = canvas.getContext("2d");
    const w = canvas.width;
    const h = canvas.height;
    const band = h / 2;

    ctx.clearRect(0, 0, w, h);
    if (history.length < 2) return;

    const request = history.map((s) => s.torqueRequest);
    const actual = history.map((s) => s.indicatedTorque);
    const correction = history.map((s) => s.torqueCorrection);

    const torquePeak = Math.max(
        1,
        ...request.map(Math.abs),
        ...actual.map(Math.abs));
    const correctionPeak = Math.max(1e-3, ...correction.map(Math.abs));

    ctx.strokeStyle = "#2b3038";
    ctx.beginPath();
    ctx.moveTo(0, band);
    ctx.lineTo(w, band);
    ctx.stroke();

    drawSeries(ctx, w, 0, band, request, torquePeak, "#6fb2ff");
    drawSeries(ctx, w, 0, band, actual, torquePeak, "#7ddc9a");
    drawSeries(ctx, w, band, band, correction, correctionPeak, "#e8a13a");

    ctx.font = "16px ui-monospace, monospace";
    ctx.fillStyle = "#6fb2ff";
    ctx.fillText("request", 8, 20);
    ctx.fillStyle = "#7ddc9a";
    ctx.fillText("actual  \u00b1" + torquePeak.toFixed(0) + " Nm", 90, 20);
    ctx.fillStyle = "#e8a13a";
    ctx.fillText("pid correction \u00b1" + correctionPeak.toFixed(3), 8, band + 20);
}


// ---- calibration views -------------------------------------------------

const views = {};
let activeView = "shiftmap";
let throttleBaseline = null;
let pedalHold = null;
const cloud = [];
const CLOUD = 4000;

function mapOf(path) {
    if (state.schema == null) return null;
    for (const p of state.schema.registry.parameters) {
        if (p.path !== path || p.type !== "map") continue;

        const live = state.maps[path];
        if (live == null) return null;

        return { path: p.path, xAxis: p.xAxis, yAxis: p.yAxis, values: live };
    }
    return null;
}

function mapValue(m, i, j) {
    return m.values[j * m.xAxis.length + i];
}

function frame(ctx, w, h, xLabel, yLabel) {
    const pad = { l: 52, r: 12, t: 12, b: 30 };
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#2b3038";
    ctx.lineWidth = 1;
    ctx.strokeRect(pad.l, pad.t, w - pad.l - pad.r, h - pad.t - pad.b);
    ctx.fillStyle = "#8b93a1";
    ctx.font = "11px ui-monospace, monospace";
    ctx.textAlign = "center";
    ctx.fillText(xLabel, (pad.l + w - pad.r) / 2, h - 8);
    ctx.save();
    ctx.translate(14, (pad.t + h - pad.b) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(yLabel, 0, 0);
    ctx.restore();
    return {
        pad,
        x: (t) => pad.l + t * (w - pad.l - pad.r),
        y: (t) => (h - pad.b) - t * (h - pad.t - pad.b)
    };
}

function axisTicks(ctx, box, w, h, xMax, yMax, yUnit) {
    ctx.fillStyle = "#8b93a1";
    ctx.textAlign = "right";
    for (let k = 0; k <= 4; ++k) {
        const t = k / 4;
        ctx.fillText(n(yMax * t, yUnit), box.pad.l - 6, box.y(t) + 4);
    }
    ctx.textAlign = "center";
    for (let k = 0; k <= 4; ++k) {
        const t = k / 4;
        ctx.fillText(n(xMax * t, 0), box.x(t), h - box.pad.b + 14);
    }
}

const GEAR_COLORS = ["#6fb2ff", "#7ddc9a", "#fdbd2e", "#ff8f6f", "#c48fff", "#5fd8d8"];

views.shiftmap = {
    label: "Shift map",
    maps: ["tcu.upshift_map", "tcu.downshift_map", "tcu.lockup_map", "tcu.overlap_shape", "tcu.engage_shape"],
    note: "solid = upshift, dashed = downshift, dotted = converter lockup. the gap between a pair is the hysteresis.",
    draw(ctx, w, h) {
        const up = mapOf("tcu.upshift_map");
        const down = mapOf("tcu.downshift_map");
        const lockup = mapOf("tcu.lockup_map");
        if (up == null) { frame(ctx, w, h, "", ""); return; }

        let peak = 1;
        for (const m of [up, down, lockup]) {
            if (m != null) for (const v of m.values) peak = Math.max(peak, v);
        }
        peak = Math.ceil(peak * 3.6 / 20) * 20;

        const box = frame(ctx, w, h, "speed  km/h", "pedal");
        axisTicks(ctx, box, w, h, peak, 1, 2);

        const series = (m, dash) => {
            if (m == null) return;
            ctx.setLineDash(dash);
            ctx.lineWidth = 2;
            for (let g = 0; g < m.yAxis.length; ++g) {
                ctx.strokeStyle = GEAR_COLORS[g % GEAR_COLORS.length];
                ctx.beginPath();
                let started = false;
                for (let i = 0; i < m.xAxis.length; ++i) {
                    const v = mapValue(m, i, g) * 3.6;
                    if (v <= 0) continue;
                    const px = box.x(v / peak);
                    const py = box.y(m.xAxis[i]);
                    if (!started) { ctx.moveTo(px, py); started = true; }
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
            ctx.setLineDash([]);
        };

        series(up, []);
        series(down, [4, 3]);
        series(lockup, [1, 4]);

        const t = state.telemetry;
        if (t.vehicleSpeed != null) {
            ctx.fillStyle = "#dfe3ea";
            ctx.beginPath();
            ctx.arc(
                box.x(Math.min(Math.abs(t.vehicleSpeed) * 3.6 / peak, 1)),
                box.y(Math.min(t.pedal || 0, 1)), 4, 0, Math.PI * 2);
            ctx.fill();
        }
    }
};

views.throttlemap = {
    label: "Throttle map",
    maps: ["ecu.throttle_map", "ecu.max_torque_map"],
    note: "engine speed vs requested torque, colour is the plate. delta shows what the estimator learned.",
    tools: [
        ["absolute / delta", () => { views.throttlemap.delta = !views.throttlemap.delta; }],
        ["reset baseline", () => { throttleBaseline = null; }]
    ],
    delta: false,
    draw(ctx, w, h) {
        const m = mapOf("ecu.throttle_map");
        if (m == null) { frame(ctx, w, h, "", ""); return; }
        if (throttleBaseline == null && Object.keys(state.maps).length > 0) {
            throttleBaseline = m.values.slice();
        }
        if (throttleBaseline == null) { frame(ctx, w, h, "", ""); return; }

        const box = frame(ctx, w, h, "engine speed  rpm", "torque  Nm");
        const xMax = m.xAxis[m.xAxis.length - 1];
        const yMax = m.yAxis[m.yAxis.length - 1];
        axisTicks(ctx, box, w, h, xMax * 60 / (2 * Math.PI), yMax, 0);

        const cw = (w - box.pad.l - box.pad.r) / m.xAxis.length;
        const ch = (h - box.pad.t - box.pad.b) / m.yAxis.length;

        for (let j = 0; j < m.yAxis.length; ++j) {
            for (let i = 0; i < m.xAxis.length; ++i) {
                const v = mapValue(m, i, j);
                let colour;
                if (views.throttlemap.delta) {
                    const d = v - (throttleBaseline[j * m.xAxis.length + i] || 0);
                    const k = Math.max(-1, Math.min(1, d * 6));
                    colour = k >= 0
                        ? "rgba(125,220,154," + k.toFixed(3) + ")"
                        : "rgba(255,143,111," + (-k).toFixed(3) + ")";
                }
                else {
                    const k = Math.max(0, Math.min(1, v));
                    colour = "rgba(111,178,255," + k.toFixed(3) + ")";
                }
                ctx.fillStyle = colour;
                ctx.fillRect(
                    box.pad.l + i * cw,
                    (h - box.pad.b) - (j + 1) * ch,
                    Math.ceil(cw), Math.ceil(ch));
            }
        }

        const t = state.telemetry;
        if (t.engineRpm != null && xMax > 0 && yMax > 0) {
            const sx = units_rpm(t.engineRpm) / xMax;
            ctx.strokeStyle = "#dfe3ea";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(
                box.x(Math.max(0, Math.min(sx, 1))),
                box.y(Math.max(0, Math.min((t.torqueRequest || 0) / yMax, 1))),
                4, 0, Math.PI * 2);
            ctx.stroke();
        }
    }
};

function units_rpm(rpm) { return rpm * 2 * Math.PI / 60; }

views.pedal = {
    label: "Pedal",
    maps: ["ecu.pedal_map"],
    note: "pedal travel against requested torque fraction. hold freezes the curve so you can switch modes and compare.",
    tools: [
        ["hold", () => {
            const m = mapOf("ecu.pedal_map");
            pedalHold = (m == null) ? null : { x: m.xAxis.slice(), v: m.values.slice() };
        }],
        ["clear", () => { pedalHold = null; }]
    ],
    draw(ctx, w, h) {
        const m = mapOf("ecu.pedal_map");
        if (m == null) { frame(ctx, w, h, "", ""); return; }

        const box = frame(ctx, w, h, "pedal", "torque fraction");
        axisTicks(ctx, box, w, h, 1, 1, 2);

        const curve = (xs, vs, colour, dash) => {
            ctx.setLineDash(dash);
            ctx.strokeStyle = colour;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < xs.length; ++i) {
                const px = box.x(xs[i]);
                const py = box.y(Math.max(0, Math.min(vs[i], 1)));
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        };

        if (pedalHold != null) curve(pedalHold.x, pedalHold.v, "#8b93a1", [4, 3]);
        curve(m.xAxis, m.values, "#6fb2ff", []);

        const t = state.telemetry;
        if (t.pedal != null) {
            ctx.fillStyle = "#dfe3ea";
            ctx.beginPath();
            ctx.arc(box.x(Math.min(t.pedal, 1)), box.y(0), 4, 0, Math.PI * 2);
            ctx.fill();
        }
    }
};

views.cloud = {
    label: "Operating points",
    note: "where the powertrain actually spends its time, coloured by gear.",
    tools: [["clear", () => { cloud.length = 0; }]],
    draw(ctx, w, h) {
        const box = frame(ctx, w, h, "engine speed  rpm", "torque  Nm");

        let rpmMax = 1000, torqueMax = 50;
        for (const p of cloud) {
            rpmMax = Math.max(rpmMax, p.rpm);
            torqueMax = Math.max(torqueMax, Math.abs(p.torque));
        }
        rpmMax = Math.ceil(rpmMax / 1000) * 1000;
        torqueMax = Math.ceil(torqueMax / 50) * 50;
        axisTicks(ctx, box, w, h, rpmMax, torqueMax, 0);

        for (const p of cloud) {
            ctx.fillStyle = GEAR_COLORS[Math.max(0, p.gear) % GEAR_COLORS.length];
            ctx.globalAlpha = 0.35;
            ctx.fillRect(
                box.x(p.rpm / rpmMax) - 1,
                box.y(Math.abs(p.torque) / torqueMax) - 1, 2, 2);
        }
        ctx.globalAlpha = 1;
    }
};

views.shifts = {
    label: "Shift scope",
    note: "the last shifts on one time base. older ones are paler — watch them get smoother.",
    data: [],
    draw(ctx, w, h) {
        const box = frame(ctx, w, h, "time since shift start  s", "clutch / slip");
        const runs = views.shifts.data;
        if (runs.length === 0) {
            ctx.fillStyle = "#8b93a1";
            ctx.textAlign = "center";
            ctx.fillText("no shift recorded yet", w / 2, h / 2);
            return;
        }

        let tMax = 0.1, slipMax = 1;
        for (const r of runs) {
            for (const s of r.samples) {
                tMax = Math.max(tMax, s[0]);
                slipMax = Math.max(slipMax, Math.abs(s[5]));
            }
        }
        axisTicks(ctx, box, w, h, tMax, 1, 2);

        runs.forEach((r, index) => {
            const age = (index + 1) / runs.length;
            ctx.lineWidth = index === runs.length - 1 ? 2 : 1;

            const line = (channel, scale, colour) => {
                ctx.globalAlpha = 0.25 + 0.75 * age;
                ctx.strokeStyle = colour;
                ctx.beginPath();
                r.samples.forEach((s, i) => {
                    const px = box.x(s[0] / tMax);
                    const py = box.y(Math.max(0, Math.min(Math.abs(s[channel]) / scale, 1)));
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                });
                ctx.stroke();
                ctx.globalAlpha = 1;
            };

            line(1, 1, "#6fb2ff");
            line(5, slipMax, "#ff8f6f");
        });
    }
};

function buildTabs() {
    const bar = document.getElementById("tabs");
    bar.textContent = "";

    for (const key of Object.keys(views)) {
        const button = document.createElement("button");
        button.textContent = views[key].label;
        button.className = key === activeView ? "on" : "";
        button.addEventListener("click", () => {
            activeView = key;
            buildTabs();
            drawView();
        });
        bar.appendChild(button);
    }

    const tools = document.getElementById("viewTools");
    tools.textContent = "";
    for (const [label, action] of (views[activeView].tools || [])) {
        const button = document.createElement("button");
        button.textContent = label;
        button.addEventListener("click", () => { action(); drawView(); });
        tools.appendChild(button);
    }

    document.getElementById("viewNote").textContent = views[activeView].note;

    buildCellEditor();
}

let refreshCellEditor = null;

function editableMaps() {
    const paths = views[activeView].maps || [];
    return paths.filter(path => mapOf(path) != null);
}

function buildCellEditor() {
    const host = document.getElementById("cellEditor");
    host.textContent = "";
    refreshCellEditor = null;

    const paths = editableMaps();
    if (!paths.length) return;

    const which = document.createElement("select");
    for (const path of paths) {
        const option = document.createElement("option");
        option.value = path;
        option.textContent = path;
        which.appendChild(option);
    }

    const column = document.createElement("select");
    const row = document.createElement("select");
    const value = document.createElement("input");
    value.type = "number";
    value.step = "any";

    const axes = () => {
        const m = mapOf(which.value);
        if (m == null) return;

        column.textContent = "";
        m.xAxis.forEach((x, i) => {
            const option = document.createElement("option");
            option.value = i;
            option.textContent = "x " + Number(x.toPrecision(4));
            column.appendChild(option);
        });

        row.textContent = "";
        m.yAxis.forEach((y, j) => {
            const option = document.createElement("option");
            option.value = j;
            option.textContent = "y " + Number(y.toPrecision(4));
            row.appendChild(option);
        });
    };

    const cellPath = () =>
        which.value + "[" + Number(column.value) + "][" + Number(row.value) + "]";

    const show = () => {
        const m = mapOf(which.value);
        if (m == null) return;
        if (document.activeElement === value) return;
        if (state.dirty.has(cellPath())) return;

        const live = Number(
            mapValue(m, Number(column.value), Number(row.value)).toPrecision(6));

        if (Number(value.value) !== live) value.value = live;
    };

    const write = () => {
        const path = cellPath();
        state.dirty.add(path);
        api("/api/set", { path, value: Number(value.value) }).catch(() => {});
        setTimeout(() => state.dirty.delete(path), 600);
    };

    which.addEventListener("change", () => { axes(); show(); });
    column.addEventListener("change", show);
    row.addEventListener("change", show);
    value.addEventListener("change", write);

    axes();
    show();

    const label = document.createElement("span");
    label.textContent = "cell";

    host.appendChild(label);
    host.appendChild(which);
    host.appendChild(column);
    host.appendChild(row);
    host.appendChild(value);

    refreshCellEditor = show;
}

function drawView() {
    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d");
    views[activeView].draw(ctx, canvas.width, canvas.height);
}

async function pollShifts() {
    try {
        views.shifts.data = await api("/api/shifts");
    }
    catch (error) { /* keep what we have */ }
}

async function poll() {
    try {
        const data = await api("/api/state");
        state.values = data.values;
        state.telemetry = data.telemetry;
        state.maps = data.maps || {};
        state.adaptive = data.adaptive || {};

        history.push(data.telemetry);
        while (history.length > HISTORY) history.shift();

        applyValues();
        renderTelemetry();
        plot();

        if (document.getElementById("cellEditor").childElementCount === 0
            && editableMaps().length > 0)
        {
            buildCellEditor();
        }
        else if (refreshCellEditor != null) {
            refreshCellEditor();
        }

        if (state.telemetry.engineRpm > 1) {
            cloud.push({
                rpm: state.telemetry.engineRpm,
                torque: state.telemetry.indicatedTorque,
                gear: state.telemetry.gear
            });
            while (cloud.length > CLOUD) cloud.shift();
        }

        drawView();

        document.getElementById("status").textContent =
            "connected · t=" + n(data.telemetry.time, 1) + "s";
    }
    catch (error) {
        document.getElementById("status").textContent = "disconnected";
    }
}

async function pollExport() {
    try {
        const learned = await api("/api/export");
        document.getElementById("export").textContent =
            learned.trim() || "nothing learned yet";

        const overrides = await api("/api/overrides");
        document.getElementById("overrides").textContent =
            overrides.trim() || "everything is at its script value";

        await pollShifts();
    }
    catch (error) { /* keep the previous contents */ }
}

async function main() {
    document.getElementById("reset").addEventListener("click", () => {
        api("/api/reset", {}).catch(() => {});
    });

    state.schema = await api("/api/schema");
    buildParameters();
    buildModes();
    buildTabs();
    await pollShifts();

    setInterval(poll, 100);
    setInterval(pollExport, 2000);
    poll();
    pollExport();
}

main().catch((error) => {
    document.getElementById("status").textContent = "failed: " + error.message;
});
</script>
</body>
